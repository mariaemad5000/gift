<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هديتي 🎁</title>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:'Tahoma', Arial, sans-serif;
    background:radial-gradient(circle at top, #2b1055 0%, #0d0221 65%, #000 100%);
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:#fffdf8; max-width:600px; width:100%; border-radius:26px;
    box-shadow:0 20px 50px rgba(0,0,0,.45); padding:0 0 26px; text-align:center;
    overflow:hidden; border:1px solid #e8e0cf; transition:max-width .2s;
  }
  .card.admin-wide{max-width:900px;}
  .header{
    background:linear-gradient(135deg,#3b1e6b,#1b0e3a);
    padding:26px 20px 20px; position:relative;
  }
  .logo{
    width:108px; height:108px; border-radius:50%; object-fit:cover;
    border:4px solid #d4af37; box-shadow:0 6px 18px rgba(0,0,0,.5);
    background:#000;
  }
  h1{font-size:23px; margin:14px 0 2px; color:#fff; letter-spacing:.5px;}
  p.sub{color:#c9bfe0; margin:0; font-size:13px;}
  .body-pad{padding:22px 24px 0;}
  label{display:block; text-align:right; font-size:14px; color:#444; margin:14px 0 6px; font-weight:bold;}
  input[type=text], select{
    width:100%; padding:13px 14px; border-radius:12px; border:2px solid #e5e0d5;
    font-size:16px; font-family:inherit; background:#faf9f5; transition:border-color .15s;
  }
  input[type=text]:focus, select:focus{outline:none; border-color:#d4af37;}
  button.main{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:14px;
    background:linear-gradient(135deg,#d4af37,#b8860b); color:#2b1055; font-size:17px; font-weight:bold; cursor:pointer;
    box-shadow:0 6px 14px rgba(184,134,11,.35);
  }
  button.main:disabled{opacity:.5; cursor:not-allowed;}
  button.main:active{transform:scale(.98);}
  #result{margin-top:18px; text-align:right;}
  .level-badge{
    display:inline-block; background:#fff3cd; color:#8a6d00; padding:6px 16px;
    border-radius:20px; font-weight:bold; font-size:14px; margin-bottom:14px;
  }
  .gift-btn{
    display:flex; align-items:center; gap:16px; width:100%; text-align:right; background:#f7f5ee; border:2px solid #e5e0d5;
    border-radius:18px; padding:12px 16px; margin-bottom:14px; font-size:18px; cursor:pointer; color:#2b1055;
    font-weight:bold; transition:.15s;
  }
  .gift-btn img{width:130px; height:130px; border-radius:14px; object-fit:cover; flex-shrink:0; border:1px solid #e5e0d5; box-shadow:0 3px 10px rgba(0,0,0,.1);}
  .gift-btn span{flex:1; text-align:right;}
  .gift-btn:hover{border-color:#d4af37; background:#fdf8ea;}
  .gift-btn.chosen{background:#e8f7ec; border-color:#4caf50; color:#276b27;}
  .msg{padding:14px; border-radius:12px; font-size:15px; margin-top:10px;}
  .msg.error{background:#ffe8e8; color:#a33;}
  .msg.success{background:#e8f7ec; color:#276b27; font-size:17px; font-weight:bold; text-align:center;}
  .spin{font-size:14px; color:#999;}
  .footer-cfg{margin-top:22px; text-align:right; padding:0 24px 24px;}
  .footer-cfg summary{cursor:pointer; color:#bbb; font-size:12px;}
  textarea{width:100%; height:110px; font-family:monospace; direction:ltr; font-size:11px; margin-top:6px;}

  /* لوحة الخادم */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; text-align:right;}
  .toolbar select, .toolbar input{
    padding:9px 12px; border-radius:10px; border:2px solid #e5e0d5; font-size:14px; font-family:inherit;
    background:#faf9f5; width:auto; letter-spacing:normal; text-align:right;
  }
  .toolbar .count{margin-inline-start:auto; font-size:13px; color:#777;}
  .admin-table{width:100%; border-collapse:collapse; font-size:14px; text-align:right;}
  .admin-table th, .admin-table td{padding:10px 12px; text-align:right; border-bottom:1px solid #eee;}
  .admin-table th{background:#f7f5ee; color:#2b1055; font-size:13px;}
  .admin-table tr:hover td{background:#fbf8f0;}
  .empty{text-align:center; color:#999; padding:30px; font-size:14px;}
  .refresh{background:#f0f7ff; border:2px solid #cfe6ff; color:#234; border-radius:10px; padding:8px 14px; cursor:pointer; font-size:13px;}
  .back-link{background:none; border:none; color:#888; font-size:13px; cursor:pointer; margin-bottom:10px; text-decoration:underline;}
</style>
</head>

// صور بديلة تعتمد على الفصل والمستوى لأن نفس اسم الهدية بيبقى منتج مختلف حسب الفصل
const WOOD_MAP = { // "ألوان خشب"
  "فصل أبانوب": { level3: "n3" },
  "فصل مرقس": { level3: "n3" },
  "فصل فيلوثاؤس": { level3: "n3" },
  "فصل مكاريوس": { level3: "n3" },
  "فصل اسطفانوس": { level3: "n3" },
  "فصل كرياكوس": { level3: "n3" },
  "فصل فيلبس": { level3: "n3", level2: "n4" }
};
const PENS_MAP = { // "أقلام جاف ملونة"
  "فصل فيلوثاؤس": { level1: "n8", level3: "n7" },
  "فصل مكاريوس": { level1: "n8", level3: "n7" },
  "فصل اسطفانوس": { level1: "n8", level3: "n7" },
  "فصل حبيب جرجس": { level1: "n8", level3: "n7" },
  "فصل البابا كيرلس": { level1: "n8", level3: "n7" },
  "فصل فيلبس": { level2: "n7" }
};
const COLOR_MAP = { // "علبة ألوان"
  "فصل كرياكوس": { level1: "n2" },
  "فصل فيلبس": { level1: "n2", level3: "n3" },
  "فصل فيلوثاؤس": { level1: "n2", level2: "cb1", level3: "n3" },
  "فصل مكاريوس": { level1: "n2", level2: "cb1", level3: "n3" },
  "فصل اسطفانوس": { level1: "n2", level2: "cb1", level3: "n3" }
};

function resolveGiftImage(className, levelRaw, text){
  const lvl = normKey(levelRaw);
  const t = (text||"");
  if (t.includes("خشب") && WOOD_MAP[className] && WOOD_MAP[className][lvl]) {
    return NEW_IMG[WOOD_MAP[className][lvl]];
  }
  if (t.includes("جاف") && PENS_MAP[className] && PENS_MAP[className][lvl]) {
    return NEW_IMG[PENS_MAP[className][lvl]];
  }
  if (t.includes("كرة قدم") || t.includes("كورة قدم")) return NEW_IMG.n1;
  if (t.includes("كورة وميدالية") || (t.includes("كورة") && !t.includes("صغيرة"))) return NEW_IMG.n9;
  if (t.includes("ألوان") && !t.includes("خشب")) {
    const key = COLOR_MAP[className] && COLOR_MAP[className][lvl];
    if (key) return key === "cb1" ? EXTRA_IMG.cb1 : NEW_IMG[key];
  }
  if (t.includes("فلوماستر") || t.includes("فلومستر")) return NEW_IMG.n5;
  if (t.includes("يوكن")) return NEW_IMG.n6;
  if (t.includes("هايلايت")) return NEW_IMG.n6;
  if (t.includes("صلصال فوم")) return NEW_IMG.n10;
  return GIFT_IMAGES[t] || null;
}

let db = null;
function getDb(){
  if (db) return db;
  const cfg = JSON.parse(document.getElementById('cfg').value);
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
  db = firebase.firestore();
  return db;
}

function norm(s){ return (s||"").trim().replace(/\s+/g," "); }
function normKey(s){ return (s||"").toString().trim().toLowerCase().replace(/\s+/g,""); }

function showMsg(html, cls){
  document.getElementById('result').innerHTML = `<div class="msg ${cls}">${html}</div>`;
}

const SERVANT_CODE = "55555";

document.getElementById('servantLink').addEventListener('click', (e) => {
  e.preventDefault();
  const code = prompt("ادخل كود الخادم:");
  if (code === null) return;
  if (code.trim() === SERVANT_CODE) {
    enterAdmin();
  } else {
    alert("الكود غلط");
  }
});

function enterAdmin(){
  document.getElementById('kidScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'block';
  document.querySelector('.card').classList.add('admin-wide');
  document.querySelector('h1').textContent = '👀 لوحة الخادم';
  document.querySelector('p.sub').textContent = 'متابعة هدايا الأطفال';
  loadAdminData();
}

function exitAdmin(){
  document.getElementById('adminScreen').style.display = 'none';
  document.getElementById('kidScreen').style.display = 'block';
  document.querySelector('.card').classList.remove('admin-wide');
  document.querySelector('h1').textContent = '🎁 هديتي';
  document.querySelector('p.sub').textContent = 'مدرسة القديس أنطونيوس للشماسة';
}
document.getElementById('backBtn').addEventListener('click', exitAdmin);

let allRows = [];

async function loadAdminData(){
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '<p class="empty">جاري التحميل...</p>';
  try {
    const database = getDb();
    const snap = await database.collection('gift_redemptions').orderBy('timestamp','desc').get();
    allRows = snap.docs.map(d => d.data());
    renderAdminTable();
  } catch (err) {
    wrap.innerHTML = '<p class="empty">حصل خطأ: ' + err.message + '</p>';
  }
}

function renderAdminTable(){
  const classVal = document.getElementById('classFilter').value;
  const nameVal = document.getElementById('nameFilter').value.trim();
  let rows = allRows.filter(r => (!classVal || r.className === classVal) && (!nameVal || (r.name||"").includes(nameVal)));
  document.getElementById('countLabel').textContent = rows.length + " نتيجة";

  const wrap = document.getElementById('tableWrap');
  if (!rows.length) { wrap.innerHTML = '<p class="empty">مفيش نتائج</p>'; return; }

  let html = '<table class="admin-table"><thead><tr><th>الاسم</th><th>الفصل</th><th>المستوى</th><th>الهدية</th><th>الوقت</th></tr></thead><tbody>';
  rows.forEach(r => {
    const t = r.timestamp && r.timestamp.toDate ? r.timestamp.toDate().toLocaleString('ar-EG') : '-';
    html += `<tr><td>${r.name||''}</td><td>${r.className||''}</td><td>${r.level||''}</td><td>${r.gift||''}</td><td>${t}</td></tr>`;
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
document.getElementById('classFilter').addEventListener('change', renderAdminTable);
document.getElementById('nameFilter').addEventListener('input', renderAdminTable);
document.getElementById('refreshBtn').addEventListener('click', loadAdminData);

let classDataCache = {};

async function loadNamesForClass(className){
  const nameSel = document.getElementById('nameInput');
  nameSel.innerHTML = '<option value="">جاري التحميل...</option>';
  nameSel.disabled = true;
  document.getElementById('result').innerHTML = "";

  if (!className) {
    nameSel.innerHTML = '<option value="">اختار الفصل الأول...</option>';
    return;
  }

  try {
    const database = getDb();
    const docId = className.replace(/\s+/g, "_");
    const snap = await database.collection("classes").doc(docId).get();

    if (!snap.exists) {
      nameSel.innerHTML = '<option value="">الفصل ده مش موجود</option>';
      return;
    }

    const data = snap.data();
    classDataCache[className] = data;

    const levels = data.levels || {};
    let names = [];
    for (const arr of Object.values(levels)) {
      if (Array.isArray(arr)) names = names.concat(arr);
    }
    names = names.map(norm).filter(Boolean).sort((a,b) => a.localeCompare(b, 'ar'));

    if (!names.length) {
      nameSel.innerHTML = '<option value="">مفيش أسماء مسجلة للفصل ده</option>';
      return;
    }

    nameSel.innerHTML = '<option value="">اختار اسمك...</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
    nameSel.disabled = false;
  } catch (err) {
    nameSel.innerHTML = '<option value="">حصل خطأ في التحميل</option>';
  }
}

document.getElementById('classSelect').addEventListener('change', (e) => {
  loadNamesForClass(e.target.value);
});

document.getElementById('searchBtn').addEventListener('click', async () => {
  const name = norm(document.getElementById('nameInput').value);
  const className = document.getElementById('classSelect').value;
  const resEl = document.getElementById('result');
  resEl.innerHTML = "";

  if (!className) { showMsg("اختار فصلك الأول 🙂", "error"); return; }
  if (!name) { showMsg("اختار اسمك الأول 🙂", "error"); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  resEl.innerHTML = `<p class="spin">بنبحث عنك...</p>`;

  try {
    const database = getDb();
    const docId = className.replace(/\s+/g, "_");
    const snap = await database.collection("classes").doc(docId).get();

    if (!snap.exists) { showMsg("الفصل ده مش موجود، كلم المشرف 🙁", "error"); btn.disabled=false; return; }

    const data = snap.data();
    const levels = data.levels || {};
    const gifts = data.gifts || {};

    // نبحث عن الاسم جوه كل مستوى
    let foundLevel = null;
    for (const [lvl, names] of Object.entries(levels)) {
      if (Array.isArray(names) && names.some(n => norm(n) === name)) { foundLevel = lvl; break; }
    }

    if (!foundLevel) {
      showMsg("مش لاقيين اسمك في الفصل ده. تأكد من كتابة الاسم صح أو كلم المشرف 🙁", "error");
      btn.disabled = false;
      return;
    }

    const giftKeyRaw = LEVEL_KEY_MAP[foundLevel] || foundLevel;
    // مطابقة اسم المستوى بين levels و gifts من غير التفات لحالة الأحرف (Level 2 = level 2)
    const giftKey = Object.keys(gifts).find(k => normKey(k) === normKey(giftKeyRaw));
    const options = giftKey ? (gifts[giftKey] || []) : [];

    // كل طفل يقدر يختار مرتين بالكتير (يعني يقدر يغيّر اختياره مرة واحدة بس)
    const redemptionId = docId + "__" + name.replace(/\s+/g, "_");
    const redemptionRef = database.collection("gift_redemptions").doc(redemptionId);
    const already = await redemptionRef.get();
    const prevData = already.exists ? already.data() : null;
    const attemptsSoFar = prevData ? (prevData.attempts || 1) : 0;

    if (attemptsSoFar >= 2) {
      showMsg(`إنت غيّرت اختيارك قبل كده وهديتك النهائية هي: <b>${prevData.gift}</b> 🎁<br>مينفعش تغيّر تاني.`, "success");
      btn.disabled = false;
      return;
    }

    if (!options.length) {
      showMsg("مفيش هدايا متسجلة للمستوى ده لسه، كلم المشرف 🙁", "error");
      btn.disabled = false;
      return;
    }

    let html = attemptsSoFar === 1
      ? `<p style="font-size:15px;color:#a33;margin-bottom:10px;">كنت اخترت <b>${prevData.gift}</b> قبل كده. تقدر تغيّر اختيارك مرة واحدة بس، اختار هديتك:</p>`
      : `<p style="font-size:15px;color:#555;margin-bottom:10px;">اختار هديتك:</p>`;
    options.forEach((g, i) => {
      const imgSrc = resolveGiftImage(className, foundLevel, g);
      const imgTag = imgSrc ? `<img src="${imgSrc}" alt="${g}">` : "";
      html += `<button class="gift-btn" data-gift="${g}">${imgTag}<span>${g}</span></button>`;
    });
    resEl.innerHTML = html;

    resEl.querySelectorAll('.gift-btn').forEach(b => {
      b.addEventListener('click', async () => {
        resEl.querySelectorAll('.gift-btn').forEach(x=>x.disabled=true);
        b.classList.add('chosen');
        const gift = b.getAttribute('data-gift');
        try {
          await redemptionRef.set({
            name: name,
            className: className,
            level: foundLevel,
            gift: gift,
            attempts: attemptsSoFar + 1,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          const note = document.createElement('div');
          note.className = "msg success";
          note.textContent = attemptsSoFar === 0
            ? `تم تسجيل هديتك: ${gift} 🎉`
            : `تم تغيير هديتك النهائية إلى: ${gift} 🎉`;
          resEl.appendChild(note);
        } catch (err) {
          const note = document.createElement('div');
          note.className = "msg error";
          note.textContent = "حصل خطأ في التسجيل: " + err.message;
          resEl.appendChild(note);
          resEl.querySelectorAll('.gift-btn').forEach(x=>x.disabled=false);
          b.classList.remove('chosen');
        }
      });
    });

  } catch (err) {
    showMsg("حصل خطأ: " + err.message, "error");
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
